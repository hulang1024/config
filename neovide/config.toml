fps_max              = 0
vsync                = true
render_to_cpu        = false
idle                 = false
hide_menus           = true
remember_window_size = false
maximized            = true
frame                = "full"
opengl               = true

[box-drawing]
# "font-glyph", "native" or "selected-native"
mode = "native"
hinting = "none"
edging = "alias"

[font]
size = 12

[[font.normal]]
family = "JetBrainsMono Nerd Font Mono"
style  = "Normal"

